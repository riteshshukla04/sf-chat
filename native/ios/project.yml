name: Chatter
options:
  bundleIdPrefix: dev.softwarefactory
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Crash reporting is off unless SENTRY_DSN is set in the environment (or on the xcodebuild
    # command line) at build time. It is deliberately NOT defined here so the environment flows through.
packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa
    from: 8.40.0
  ChatterCore:
    path: ChatterCore
targets:
  Chatter:
    type: application
    platform: iOS
    sources:
      - path: Chatter
    dependencies:
      - package: Sentry
        product: Sentry
      - package: ChatterCore
        product: ChatterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.softwarefactory.chatter
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Chatter/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Chatter/Info.plist
      properties:
        CFBundleDisplayName: Chatter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Empty unless SENTRY_DSN is provided at build time.
        SentryDSN: $(SENTRY_DSN)
  ChatterTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ChatterTests
    dependencies:
      - target: Chatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.softwarefactory.chatter.tests
        GENERATE_INFOPLIST_FILE: YES
  ChatterUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ChatterUITests
    dependencies:
      - target: Chatter
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.softwarefactory.chatter.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Chatter:
    build:
      targets:
        Chatter: all
        ChatterTests: [test]
        ChatterUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ChatterTests
        - ChatterUITests
