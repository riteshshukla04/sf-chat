# XcodeGen spec: `xcodegen generate` writes Chatter.xcodeproj (git-ignored). See README.md.
name: Chatter
options:
  bundleIdPrefix: dev.softwarefactory
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
packages:
  ChatterCore:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Chatter:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: ChatterCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.softwarefactory.chatter
        PRODUCT_NAME: Chatter
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: App/Info.plist
    scheme:
      testTargets: []
schemes:
  Chatter:
    build:
      targets:
        Chatter: all
    run:
      config: Debug
