# Native Android app (debug build: android-native, applicationId dev.softwarefactory.chatter.native).
# Same steps as send-message.yaml; the native screens carry the same testIDs as resource ids.
# For the native iOS app, change appId to dev.softwarefactory.chatter (iOS has no ".native" suffix).
appId: dev.softwarefactory.chatter.native
---
- launchApp
- tapOn:
    id: chat-row-asha
- assertVisible:
    id: chat-subtitle
- tapOn:
    id: message-input
- inputText: Looks good, approving now
- tapOn:
    id: send
- assertVisible: Looks good, approving now
